# =============================================================================
# Job: daily-ingestion-etl-pipeline
# =============================================================================
# Multi-task workflow:
#   1. salesforce_ingestion (parallel)
#   2. pmm_ingestion      (parallel)
#   3. etl_pipeline        (depends on both 1 & 2)
# =============================================================================

name: daily-ingestion-etl-pipeline
description: "Daily data ingestion from Salesforce & PMM, followed by ETL to silver Delta tables"

schedule:
  quartz_cron_expression: "0 0 2 * * ?"
  timezone_id: UTC
  pause_status: UNPAUSED

max_concurrent_runs: 1

parameters:
  - name: trade_date
    default: "{{yesterday}}"

tags:
  project: "databricks-ingestion-etl"
  environment: ${var.environment}
  managed_by: "databricks-asset-bundle"

email_notifications:
  on_failure:
    - ${var.email_notifications}
  on_duration_warning_threshold_exceeded:
    - ${var.email_notifications}

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
tasks:
  # --- Salesforce Ingestion ---
  - task_key: salesforce_ingestion
    description: "Extract Salesforce data via Bulk API 2.0 and save as Parquet to raw layer"
    existing_cluster_id: ${var.cluster_id}
    notebook_task:
      notebook_path: ${workspace.root_path}/notebooks/salesforce_ingestion
      source: WORKSPACE
      base_parameters:
        config_path: "/Workspace/Shared/pipeline_config.yaml"
        trade_date: "{{job.parameter.trade_date}}"
    timeout_seconds: 3600
    max_retries: 3
    min_retry_interval_millis: 300000
    retry_on_timeout: true

  # --- PMM Ingestion ---
  - task_key: pmm_ingestion
    description: "Extract PMM data via REST API and save as Parquet to raw layer"
    existing_cluster_id: ${var.cluster_id}
    notebook_task:
      notebook_path: ${workspace.root_path}/notebooks/pmm_ingestion
      source: WORKSPACE
      base_parameters:
        config_path: "/Workspace/Shared/pipeline_config.yaml"
        trade_date: "{{job.parameter.trade_date}}"
    timeout_seconds: 3600
    max_retries: 3
    min_retry_interval_millis: 300000
    retry_on_timeout: true

  # --- ETL Pipeline (depends on both ingestions) ---
  - task_key: etl_pipeline
    description: "Read raw Parquet, validate, filter, join, aggregate, and write to silver Delta tables"
    depends_on:
      - task_key: salesforce_ingestion
        outcome: success
      - task_key: pmm_ingestion
        outcome: success
    existing_cluster_id: ${var.cluster_id}
    notebook_task:
      notebook_path: ${workspace.root_path}/notebooks/etl_pipeline
      source: WORKSPACE
      base_parameters:
        config_path: "/Workspace/Shared/pipeline_config.yaml"
        trade_date: "{{job.parameter.trade_date}}"
    timeout_seconds: 7200
    max_retries: 2
    min_retry_interval_millis: 300000
    retry_on_timeout: true
