# =============================================================================
# Job: etl-only-pipeline
# =============================================================================
# Standalone ETL pipeline (Raw → Silver) — can be triggered independently
# or used as a recovery job when ingestion already completed.
# =============================================================================

name: etl-only-pipeline
description: "Standalone ETL pipeline (Raw → Silver) — can be triggered independently"

schedule:
  quartz_cron_expression: "0 0 4 * * ?"
  timezone_id: UTC
  pause_status: UNPAUSED

max_concurrent_runs: 1

parameters:
  - name: trade_date
    default: "{{yesterday}}"

tags:
  project: "databricks-ingestion-etl"
  environment: ${var.environment}
  managed_by: "databricks-asset-bundle"

email_notifications:
  on_failure:
    - ${var.email_notifications}
  on_duration_warning_threshold_exceeded:
    - ${var.email_notifications}

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
tasks:
  # =========================================================================
  # Task type selection:
  #   - notebook_task:   interactive debugging, cell-by-cell output in UI
  #   - python_wheel_task: stateless, testable locally, CI-friendly
  #
  # To switch, comment out one block and uncomment the other.
  # =========================================================================

  - task_key: etl_pipeline
    description: "Read raw Parquet, validate, filter, join, aggregate, and write to silver Delta tables"
    existing_cluster_id: ${var.cluster_id}

    # -- Option A: notebook_task (default — interactive) --
    notebook_task:
      notebook_path: ${workspace.root_path}/notebooks/etl_pipeline
      source: WORKSPACE
      base_parameters:
        config_path: "/Workspace/Shared/pipeline_config.yaml"
        trade_date: "{{job.parameter.trade_date}}"

    # -- Option B: python_wheel_task (uncomment to use) --
    # python_wheel_task:
    #   package_name: databricks_ingestion_etl_pipeline
    #   entry_point: bank_etl.entry_points.etl_pipeline_entry:main
    #   parameters:
    #     - "--config_path"
    #     - "/Workspace/Shared/pipeline_config.yaml"
    #     - "--trade_date"
    #     - "{{job.parameter.trade_date}}"

    timeout_seconds: 7200
    max_retries: 2
    min_retry_interval_millis: 300000
    retry_on_timeout: true
