AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Glue ETL Pipeline - S3 Event → SQS → Lambda → Glue (PySpark)
  Serverless CSV ingestion pipeline using AWS Glue instead of EMR.
  Uses AWS Lake Formation for fine-grained access control on the processed S3 bucket.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name used for resource naming.

  GlueWorkerType:
    Type: String
    Default: G.1X
    AllowedValues:
      - G.1X
      - G.2X
      - G.4X
      - G.8X
      - G.025X
    Description: Glue worker type (G.1X = 16GB RAM, G.025X = 4GB RAM for Python shell).

  GlueWorkerCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 100
    Description: Number of Glue workers.

  GlueJobTimeout:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 2880
    Description: Glue job timeout in minutes.

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket name where Lambda deployment packages are stored.

  GlueArtifactsBucket:
    Type: String
    Description: S3 bucket name for Glue job scripts and dependencies.

  DataBucketName:
    Type: String
    Description: S3 bucket name where CSV files are dropped for ingestion.

  ProcessedBucketName:
    Type: String
    Description: S3 bucket name where processed output is stored.

  LakeFormationDatabaseName:
    Type: String
    Default: etl_processed_data
    Description: Name of the Lake Formation database for processed data.

  LakeFormationTableName:
    Type: String
    Default: csv_output
    Description: Name of the Lake Formation table for processed CSV/Parquet data.

  ProcessedDataLakePrincipal:
    Type: String
    Default: ''
    Description: >
      IAM role ARN or user ARN to grant Lake Formation data access to
      (e.g., 'arn:aws:iam::123456789012:role/DataAnalystRole').
      Leave empty to grant access only to the Glue job role.

  LambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: Lambda function memory size in MB.

  LambdaTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Lambda function timeout in seconds.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch log retention period in days.

  SqsVisibilityTimeout:
    Type: Number
    Default: 300
    Description: SQS message visibility timeout in seconds.

  SqsDelaySeconds:
    Type: Number
    Default: 0
    Description: SQS delivery delay in seconds.

  GithubRepoOwner:
    Type: String
    Description: GitHub repository owner for OIDC authentication.

  GithubRepoName:
    Type: String
    Description: GitHub repository name for OIDC authentication.

Conditions:
  HasVpcConfig: !Not [!Equals [!Ref VpcId, '']]
  HasExternalPrincipal: !Not [!Equals [!Ref ProcessedDataLakePrincipal, '']]

Resources:
  # ============================================================
  # S3 BUCKETS
  # ============================================================
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${DataBucketName}-${AWS::AccountId}-${EnvironmentName}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: _COMPLETE
            Queue: !GetAtt IngestionQueue.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProcessedBucketName}-${AWS::AccountId}-${EnvironmentName}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLockObjects
            Status: Enabled
            ExpirationInDays: 7
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlueArtifactsBucketResource:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # SQS QUEUE
  # ============================================================
  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-csv-ingestion-queue'
      VisibilityTimeout: !Ref SqsVisibilityTimeout
      DelaySeconds: !Ref SqsDelaySeconds
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-csv-ingestion-dlq'
      MessageRetentionPeriod: 1209600

  # ============================================================
  # SQS QUEUE POLICY
  # ============================================================
  IngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:s3:::${DataBucket}-${AWS::AccountId}-${EnvironmentName}'

  # ============================================================
  # LAMBDA FUNCTION (SQS consumer → Glue trigger)
  # ============================================================
  GlueTriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-glue-trigger-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GlueTriggerLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IngestionQueue.Arn
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:BatchStopJobRun
                Resource: !GetAtt CsvEtlGlueJob.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${DataBucket}-${AWS::AccountId}-${EnvironmentName}/*'
                  - !Sub 'arn:aws:s3:::${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}/*'
                  - !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}/*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt GlueJobRole.Arn

  GlueTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-glue-trigger'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt GlueTriggerLambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Sub 'lambda/glue-trigger-${EnvironmentName}.zip'
      Environment:
        Variables:
          ENVIRONMENT: !Ref EnvironmentName
          GLUE_JOB_NAME: !Ref CsvEtlGlueJob
          GLUE_ARTIFACTS_BUCKET: !Sub '${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}'
          PROCESSED_BUCKET: !Sub '${ProcessedBucketName}-${AWS::AccountId}-${EnvironmentName}'
          DATA_BUCKET: !Sub '${DataBucketName}-${AWS::AccountId}-${EnvironmentName}'
          LOCK_BUCKET: !Sub '${ProcessedBucketName}-${AWS::AccountId}-${EnvironmentName}'
          LOCK_EXPIRY_DAYS: '7'
          LOCK_STALE_TIMEOUT_SECONDS: '3600'

  # ============================================================
  # LAMBDA EVENT SOURCE MAPPING (SQS trigger)
  # ============================================================
  LambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt IngestionQueue.Arn
      FunctionName: !Ref GlueTriggerLambda
      MaximumBatchingWindowInSeconds: 0

  # ============================================================
  # CLOUDWATCH LOG GROUP
  # ============================================================
  GlueTriggerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GlueTriggerLambda}'
      RetentionInDays: !Ref LogRetentionDays

  # ============================================================
  # GLUE JOB IAM ROLE
  # ============================================================
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-glue-job-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueJobS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${DataBucket}-${AWS::AccountId}-${EnvironmentName}/*'
                  - !Sub 'arn:aws:s3:::${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}/*'
                  - !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
                  - !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              # Lake Formation permissions — allows Glue to read/write
              # data governed by Lake Formation
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                  - lakeformation:GetDataLakeSettings
                  - lakeformation:ListPermissions
                  - lakeformation:ListResources
                Resource: '*'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:BatchCreatePartition
                  - glue:BatchGetPartition
                  - glue:CreatePartition
                  - glue:UpdatePartition
                  - glue:DeletePartition
                  - glue:GetPartition
                  - glue:GetPartitions
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${LakeFormationDatabaseName}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${LakeFormationDatabaseName}/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/${LakeFormationDatabaseName}/*'
              # Allow Glue job to start the crawler after ETL completes
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                  - glue:GetCrawler
                  - glue:GetCrawlerMetrics
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${EnvironmentName}-processed-data-crawler'

  # ============================================================
  # GLUE JOB
  # ============================================================
  CsvEtlGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${EnvironmentName}-csv-etl-job'
      Description: !Sub 'CSV ETL job for ${EnvironmentName} — processes CSV files from S3 and writes Parquet output'
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}/glue-jobs/csv_etl_job.py'
        PythonVersion: '3'
      DefaultArguments:
        '--environment': !Ref EnvironmentName
        '--PROCESSED_BUCKET': !Sub '${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
        '--job-language': 'python'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-auto-scaling': 'true'
        '--enable-metrics': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}/spark-logs/'
        '--TempDir': !Sub 's3://${GlueArtifactsBucket}-${AWS::AccountId}-${EnvironmentName}/temp/'
      GlueVersion: '5.0'
      WorkerType: !Ref GlueWorkerType
      NumberOfWorkers: !Ref GlueWorkerCount
      Timeout: !Ref GlueJobTimeout
      MaxRetries: 1
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: Glue-ETL-Pipeline

  # ============================================================
  # LAKE FORMATION — DATA ACCESS CONTROL
  # ============================================================
  # Lake Formation provides fine-grained access control on the processed
  # S3 bucket. Instead of granting direct S3 access, we register the
  # processed bucket path as a Lake Formation resource and grant
  # permissions through Lake Formation.
  #
  # This allows:
  #   - Column-level security (e.g., hide PII columns from certain roles)
  #   - Row-level filtering (e.g., only show rows where region='US')
  #   - Time-based access controls
  #   - Audit trail of all data access

  # Register the processed bucket as a Lake Formation resource
  # This tells Lake Formation to govern access to this S3 location
  LakeFormationProcessedDataLocation:
    Type: AWS::LakeFormation::Resource
    DependsOn: ProcessedBucket
    Properties:
      ResourceArn: !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
      UseServiceLinkedRole: true

  # Create a Lake Formation database for the processed data
  # This database will contain tables that point to the processed S3 data
  ProcessedDataDatabase:
    Type: AWS::Glue::Database
    DependsOn: LakeFormationProcessedDataLocation
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref LakeFormationDatabaseName
        Description: !Sub 'Lake Formation governed database for processed ETL data in ${EnvironmentName}'
        LocationUri: !Sub 's3://${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}/'
        Parameters:
          environment: !Ref EnvironmentName
          managedBy: CloudFormation
          lakeFormationManaged: 'true'

  # Glue Crawler — auto-discovers Parquet schema in the processed bucket
  # Replaces the static Glue Table. The crawler scans the output/ prefix,
  # infers the schema from Parquet files, and creates/updates the table
  # in the Glue Data Catalog. Triggered by the Glue job after ETL completes.
  ProcessedDataCrawler:
    Type: AWS::Glue::Crawler
    DependsOn:
      - ProcessedDataDatabase
      - GlueJobRole
    Properties:
      Name: !Sub '${EnvironmentName}-processed-data-crawler'
      Description: !Sub 'Auto-discovers Parquet schema from processed ETL output in ${EnvironmentName}'
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref LakeFormationDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub 's3://${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}/output/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      TablePrefix: !Sub '${EnvironmentName}_'
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Tables": {
              "AddOrUpdateBehavior": "MergeNewColumns"
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: Glue-ETL-Pipeline

  # Grant the Glue job role full access to the Lake Formation database
  # This allows the Glue job AND crawler to create/update tables
  # governed by Lake Formation. Database-level grants replace the
  # previous table-level grants since the crawler creates tables dynamically.
  GlueJobLakeFormationDatabaseGrant:
    Type: AWS::LakeFormation::Permissions
    DependsOn:
      - ProcessedDataDatabase
      - GlueJobRole
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt GlueJobRole.Arn
      Resource:
        DatabaseResource:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref LakeFormationDatabaseName
      Permissions:
        - CREATE_TABLE
        - ALTER
        - DROP
        - DESCRIBE
      PermissionsWithGrantOption:
        - CREATE_TABLE

  # Grant the Glue job role access to ALL tables in the database
  # (replaces the previous single-table grant — crawler creates tables dynamically)
  GlueJobLakeFormationAllTablesGrant:
    Type: AWS::LakeFormation::Permissions
    DependsOn:
      - ProcessedDataDatabase
      - GlueJobRole
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt GlueJobRole.Arn
      Resource:
        TableWithColumnsResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref LakeFormationDatabaseName
          Name: '*'
      Permissions:
        - SELECT
        - INSERT
        - ALTER
        - DROP
        - DESCRIBE

  # Grant the Glue job role access to the registered S3 location
  GlueJobLakeFormationDataLocationGrant:
    Type: AWS::LakeFormation::Permissions
    DependsOn:
      - LakeFormationProcessedDataLocation
      - GlueJobRole
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt GlueJobRole.Arn
      Resource:
        DataLocationResource:
          CatalogId: !Ref AWS::AccountId
          S3Resource: !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
      Permissions:
        - DATA_LOCATION_ACCESS

  # If a data lake principal is specified, grant them SELECT access
  # to ALL tables in the database (crawler creates tables dynamically)
  ExternalPrincipalAllTablesGrant:
    Type: AWS::LakeFormation::Permissions
    Condition: HasExternalPrincipal
    DependsOn:
      - ProcessedDataDatabase
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref ProcessedDataLakePrincipal
      Resource:
        TableWithColumnsResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref LakeFormationDatabaseName
          Name: '*'
      Permissions:
        - SELECT
        - DESCRIBE

  # ============================================================
  # GITHUB OIDC ROLE FOR DEPLOYMENT
  # ============================================================
  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-github-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GithubRepoOwner}/${GithubRepoName}:*'
      Policies:
        - PolicyName: DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - s3:*
                  - lambda:*
                  - sqs:*
                  - glue:*
                  - iam:PassRole
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - logs:*
                Resource: '*'

  # ============================================================
  # OUTPUTS
  # ============================================================
Outputs:
  DataBucketName:
    Description: S3 bucket for incoming CSV files
    Value: !Ref DataBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataBucket'

  ProcessedBucketName:
    Description: S3 bucket for processed output
    Value: !Ref ProcessedBucket
    Export:
      Name: !Sub '${AWS::StackName}-ProcessedBucket'

  GlueArtifactsBucketName:
    Description: S3 bucket for Glue job artifacts
    Value: !Ref GlueArtifactsBucketResource
    Export:
      Name: !Sub '${AWS::StackName}-GlueArtifactsBucket'

  IngestionQueueUrl:
    Description: SQS queue URL for CSV ingestion events
    Value: !Ref IngestionQueue
    Export:
      Name: !Sub '${AWS::StackName}-IngestionQueueUrl'

  IngestionQueueArn:
    Description: SQS queue ARN for CSV ingestion events
    Value: !GetAtt IngestionQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-IngestionQueueArn'

  IngestionDeadLetterQueueUrl:
    Description: SQS dead letter queue URL
    Value: !Ref IngestionDeadLetterQueue
    Export:
      Name: !Sub '${AWS::StackName}-IngestionDLQUrl'

  GlueTriggerLambdaArn:
    Description: Lambda function ARN for triggering Glue jobs
    Value: !GetAtt GlueTriggerLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GlueTriggerLambdaArn'

  GlueTriggerLambdaName:
    Description: Lambda function name for triggering Glue jobs
    Value: !Ref GlueTriggerLambda
    Export:
      Name: !Sub '${AWS::StackName}-GlueTriggerLambdaName'

  CsvEtlGlueJobName:
    Description: Glue job name for CSV ETL processing
    Value: !Ref CsvEtlGlueJob
    Export:
      Name: !Sub '${AWS::StackName}-CsvEtlGlueJobName'

  GlueJobRoleArn:
    Description: IAM role ARN for Glue job execution
    Value: !GetAtt GlueJobRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GlueJobRoleArn'

  GithubDeployRoleArn:
    Description: IAM role ARN for GitHub Actions deployment
    Value: !GetAtt GithubDeployRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GithubDeployRoleArn'

  LockBucketName:
    Description: S3 bucket used for distributed lock objects (exactly-once dedup)
    Value: !Ref ProcessedBucket
    Export:
      Name: !Sub '${AWS::StackName}-LockBucketName'

  LakeFormationDatabaseName:
    Description: Lake Formation database for processed data
    Value: !Ref LakeFormationDatabaseName
    Export:
      Name: !Sub '${AWS::StackName}-LakeFormationDatabaseName'

  LakeFormationTableName:
    Description: Lake Formation table for processed data
    Value: !Ref LakeFormationTableName
    Export:
      Name: !Sub '${AWS::StackName}-LakeFormationTableName'

  LakeFormationProcessedLocationArn:
    Description: ARN of the Lake Formation registered S3 location
    Value: !Sub 'arn:aws:s3:::${ProcessedBucket}-${AWS::AccountId}-${EnvironmentName}'
    Export:
      Name: !Sub '${AWS::StackName}-LakeFormationProcessedLocationArn'
